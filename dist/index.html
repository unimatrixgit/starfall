<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall Command</title><style>
:root{color-scheme:dark;--bg:#070e1c;--panel:#101d32;--line:#28435d;--gold:#e6bf71;--blue:#72d6ff;--muted:#94a9be}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 65% -10%,#1b3659,#070e1c 65%);font:15px system-ui,Arial;color:#e9f3ff}header{padding:22px 4%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;letter-spacing:.13em;font-size:24px;color:var(--gold)}h2{margin:0 0 14px;font-size:18px;color:var(--gold)}h3{margin:8px 0}small,.muted{color:var(--muted)}button{cursor:pointer;background:#1c3d5d;border:1px solid #39769a;color:white;padding:9px 13px;border-radius:6px}button:hover:not(:disabled){background:#28618b}button:disabled{opacity:.4;cursor:not-allowed}.danger{border-color:#a84c54}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 100px)}nav{border-right:1px solid var(--line);padding:20px 12px}nav button{display:block;width:100%;margin:5px 0;text-align:left;background:transparent;border-color:transparent}nav button.active{background:#1a3a58;border-color:var(--line)}main{padding:22px 4%;max-width:1200px;width:100%;margin:auto}.resources{display:flex;gap:15px;flex-wrap:wrap}.resource{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:8px;min-width:135px}.resource strong{display:block;color:var(--blue);font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:linear-gradient(150deg,#14243c,#0e1b2d);border:1px solid var(--line);border-radius:10px;padding:18px}.card p{color:var(--muted);line-height:1.5}.card .stat{color:var(--blue)}.card button{margin-top:8px}.hero{padding:30px;background:linear-gradient(100deg,#1a3455,#111d32);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}.hero h2{font-size:28px}.log{max-height:320px;overflow:auto}.log p{border-bottom:1px solid var(--line);padding:8px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}input,select{background:#0c1829;color:white;border:1px solid var(--line);border-radius:5px;padding:9px;max-width:100%}.tag{display:inline-block;border:1px solid #436785;border-radius:20px;padding:4px 10px;color:var(--blue)}@media(max-width:650px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto}main{padding:16px}header{padding:15px}}</style></head>
<body><header><div><h1>✦ STARFALL COMMAND</h1><small>Planetary strategy • Local practice universe</small></div><div class="resources" id="resources"></div></header><div class="layout"><nav id="nav"></nav><main id="content"></main></div><script src="./game.js"></script></body></html>
